<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift</title>
<meta name="description" content="Your gym rotation, today's weights and every set you lift.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0D0E10">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 13V9M9.5 2.5h5"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4.5h8v5a4 4 0 0 1-8 0zM8 6.5H4.5a3.5 3.5 0 0 0 3.8 3.5M16 6.5h3.5a3.5 3.5 0 0 1-3.8 3.5M12 13.5v3.5M8.5 20h7M10 17h4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-up-arrow" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M5 8.5h14M5 12h14M5 15.5h14"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
</svg>

<main id="view" tabindex="-1"></main>

<button id="resume" class="resume" hidden>
  <span class="resume-dot"></span>
  <span class="resume-text"><b id="resume-name">Workout</b><span id="resume-time">0:00</span></span>
  <span class="resume-go">Resume</span>
</button>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="today"><svg class="ic" aria-hidden="true"><use href="#i-dumbbell"/></svg><span>Today</span></button>
  <button data-tab="routines"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>Routines</span></button>
  <button data-tab="history"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span>History</span></button>
  <button data-tab="profile"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></button>
</nav>

<div id="rest" class="rest" hidden>
  <div class="rest-bar"><i id="rest-fill"></i></div>
  <div class="rest-row">
    <button class="pill" data-rest="-15">−15</button>
    <div class="rest-mid"><span class="rest-label" id="rest-label">Rest</span><b id="rest-time">1:30</b></div>
    <button class="pill" data-rest="15">+15</button>
    <button class="pill accent" data-rest="skip">Skip</button>
  </div>
</div>

<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
